<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>촬영 리스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: #111; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .date-badge { display: inline-block; background: #111; color: #fff; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
    .id { font-size: 15px; font-weight: 700; color: #111; margin-bottom: 6px; }
    .link a { font-size: 13px; color: #0066cc; word-break: break-all; text-decoration: none; }
    .link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>📋 촬영 리스트</h1>

  <div class="card">
    <div class="date-badge">24일</div>
    <div class="id">anotherdoor_travel</div>
    <div class="link"><a href="https://www.instagram.com/p/DXmN9c_Eay7/" target="_blank">instagram.com/p/DXmN9c_Eay7</a></div>
  </div>

  <div class="card">
    <div class="date-badge">24일 2시</div>
    <div class="id">rorocouple_trip</div>
    <div class="link"><a href="https://www.instagram.com/rorocouple_trip?igsh=MTNvdzI0Z2pqcXZvYw%3D%3D" target="_blank">instagram.com/rorocouple_trip</a></div>
  </div>

  <div class="card">
    <div class="date-badge">28일 2시</div>
    <div class="id">honey___pick</div>
    <div class="link"><a href="https://www.instagram.com/honey___pick/reels/" target="_blank">instagram.com/honey___pick/reels</a></div>
  </div>

</body>
</html>
